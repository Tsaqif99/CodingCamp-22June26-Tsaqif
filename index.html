<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">🌙 Dark Mode</button>
    </div>
  </header>

  <main>
    <!-- Section 1: Input Form -->
    <section id="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Tambahkan Transaksi</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="item-name">Nama Item</label>
          <input
            type="text"
            id="item-name"
            name="name"
            maxlength="100"
            placeholder="Seperti: Makan Siang"
            autocomplete="off"
            required
          />
        </div>

        <div class="form-group">
          <label for="amount">Jumlah</label>
          <input
            type="text"
            id="amount"
            name="amount"
            inputmode="numeric"
            placeholder="Seperti: 25.000"
            required
          />
        </div>

        <div class="form-group">
          <label for="type">Tipe</label>
          <select id="type" name="type" required>
            <option value="">-- Select type --</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Kategori</label>
          <select id="category" name="category" required>
            <option value="">-- Select category --</option>
            <option value="Food">Makanan</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Hiburan</option>
            <option value="Work">Pekerjaan</option>
            <option value="Other">Lainnya</option>
          </select>
        </div>

        <div class="form-group" id="custom-category-group" style="display: none;">
          <label for="custom-category">Kategori Lain</label>
          <input
            type="text"
            id="custom-category"
            name="customCategory"
            maxlength="50"
            placeholder="Masukkan kategori sendiri"
            autocomplete="off"
          />
        </div>

        <div id="form-errors" class="form-errors" aria-live="polite"></div>

        <button type="submit" class="btn-submit">Tambahkan Transaksi</button>
      </form>
    </section>

    <!-- Section 2: Balance -->
    <section id="balance-section" aria-labelledby="balance-heading">
      <h2 id="balance-heading">Total Uang Saat Ini</h2>
      <p id="balance-display" class="balance-amount">0.00</p>
    </section>

    <!-- Section 3: Transaction List -->
    <section id="list-section" aria-labelledby="list-heading">
      <h2 id="list-heading">Transaksi</h2>
      <div class="transaction-controls">
        <div class="form-group compact">
          <label for="filter-type">Tampilkan</label>
          <select id="filter-type">
            <option value="all">Semua</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>
        <div class="form-group compact">
          <label for="sort-by">Urutkan</label>
          <select id="sort-by">
            <option value="latest">Terbaru</option>
            <option value="amount-desc">Jumlah Terbesar</option>
            <option value="amount-asc">Jumlah Terkecil</option>
            <option value="category">Kategori</option>
          </select>
        </div>
      </div>
      <ul id="transaction-list" aria-label="Transaction list">
        <li id="empty-list-msg" class="empty-state">Tidak ada transaksi</li>
      </ul>
    </section>

    <!-- Section 4: Chart -->
    <section id="chart-section" aria-labelledby="chart-heading">
      <h2 id="chart-heading">Pengeluaran berdasarkan Kategori</h2>
      <p id="empty-chart-msg" class="empty-state">Tidak ada data pengeluaran untuk ditampilkan</p>
      <canvas id="expense-chart" width="300" height="300" aria-label="Pie chart of expenses by category" role="img"></canvas>
    </section>
  </main>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- App logic -->
  <script defer src="app.js"></script>
</body>
</html>
